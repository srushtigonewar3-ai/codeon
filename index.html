<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personalized Study Plan Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📚 AI Personalized Study Plan Generator</h1>
    <p>Create a customized study schedule based on your learning needs.</p>

    <form id="studyForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Grade/Class</label>
        <input type="text" id="grade" placeholder="e.g. 10th Grade">

        <label>Subjects</label>
        <input type="text" id="subjects" placeholder="Math, Science, English">

        <label>Exam Date</label>
        <input type="date" id="exam">

        <label>Hours Available Per Day</label>
        <input type="number" id="hours" min="1" max="12">

        <label>Current Skill Level</label>
        <select id="level">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select>

        <label>Weak Topics</label>
        <input type="text" id="weak" placeholder="Algebra, Grammar">

        <label>Strong Topics</label>
        <input type="text" id="strong" placeholder="Geometry, Reading">

        <label>Preferred Learning Style</label>
        <select id="learning">
            <option>Visual</option>
            <option>Auditory</option>
            <option>Reading/Writing</option>
            <option>Kinesthetic</option>
        </select>

        <label>Target Score</label>
        <input type="text" id="target" placeholder="95%">

        <button type="submit">Generate Study Plan</button>

    </form>

    <div id="output" class="output"></div>

</div>

<script src="script.js"></script>

</body>
</html>
